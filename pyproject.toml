[build-system] requires = ["hatchling>=1.26"] build-backend = "hatchling.build"

[project] name = "sre-agent" version = "0.1.0" description = "Proprietary AI-powered Site Reliability Engineering investigation platform" readme = "README.md" requires-python = ">=3.12" license = "LicenseRef-Proprietary" license-files = ["LICENSE"] authors = [ { name = "YOUR COMPANY NAME" } ] keywords = [ "sre", "site-reliability-engineering", "ai-agent", "infrastructure", "observability", "incident-management", "automation" ] classifiers = [ "Development Status :: 3 - Alpha", "Framework :: FastAPI", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Topic :: System :: Monitoring", "Topic :: Software Development :: Libraries :: Python Modules" ]

dependencies = [ "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.34,<1.0", "pydantic>=2.10,<3.0", "pydantic-settings>=2.7,<3.0", "sqlalchemy[asyncio]>=2.0.37,<3.0", "asyncpg>=0.30,<1.0", "alembic>=1.14,<2.0", "redis>=5.2,<7.0", "celery[redis]>=5.4,<6.0", "httpx>=0.28,<1.0", "tenacity>=9.0,<10.0", "structlog>=25.1,<26.0", "python-json-logger>=3.2,<4.0", "PyJWT[crypto]>=2.10,<3.0", "pwdlib[argon2]>=0.2,<1.0", "python-multipart>=0.0.20,<1.0", "email-validator>=2.2,<3.0", "cryptography>=44.0,<46.0", "opentelemetry-api>=1.29,<2.0", "opentelemetry-sdk>=1.29,<2.0", "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0", "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1.0", "prometheus-client>=0.21,<1.0" ]

[project.optional-dependencies]

llm = [ "openai>=1.60,<3.0", "anthropic>=0.45,<1.0" ]

kubernetes = [ "kubernetes>=32.0,<36.0" ]

aws = [ "boto3>=1.36,<2.0" ]

prometheus = [ "prometheus-api-client>=0.6,<1.0" ]

grafana = [ "grafana-api>=1.0,<2.0" ]

mcp = [ "mcp>=1.0,<2.0" ]

postgres = [ "psycopg[binary]>=3.2,<4.0" ]

dev = [ "pytest>=8.3,<10.0", "pytest-asyncio>=0.25,<2.0", "pytest-cov>=6.0,<8.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0", "mypy>=1.14,<2.0", "pre-commit>=4.1,<5.0", "respx>=0.22,<1.0", "testcontainers[postgres,redis]>=4.9,<5.0" ]

[project.urls] Documentation = "https://your-domain.com/docs" Repository = "https://github.com/YOUR_ORGANIZATION/sre-agent" Issues = "https://github.com/YOUR_ORGANIZATION/sre-agent/issues"

[tool.hatch.build.targets.wheel] packages = ["src/sre_agent"]

[tool.pytest.ini_options] testpaths = ["tests"] python_files = ["test_.py"] python_classes = ["Test"] python_functions = ["test_*"] asyncio_mode = "auto" addopts = [ "-ra", "--strict-markers", "--strict-config", "--cov=sre_agent", "--cov-report=term-missing" ] markers = [ "unit: Unit tests", "integration: Integration tests", "contract: Contract tests", "security: Security tests", "e2e: End-to-end tests" ]

[tool.ruff] line-length = 100 target-version = "py312" src = ["src", "tests"]

[tool.ruff.lint] select = [ "E", "F", "I", "B", "UP", "S", "SIM", "ASYNC", "RUF" ]

ignore = [ "E501" ]

[tool.ruff.lint.per-file-ignores] "tests/**/*.py" = ["S101"]

[tool.ruff.format] quote-style = "double" indent-style = "space"

[tool.mypy] python_version = "3.12" mypy_path = "src" packages = ["sre_agent"] strict = true warn_unused_configs = true warn_redundant_casts = true warn_unreachable = true no_implicit_optional = true show_error_codes = true

[tool.coverage.run] branch = true source = ["sre_agent"] omit = [ "/tests/", "*/init.py" ]

[tool.coverage.report] show_missing = true skip_covered = true fail_under = 80
