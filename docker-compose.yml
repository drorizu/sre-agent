name: sre-agent

services:

-----------------------------------------------
SRE Agent API
-----------------------------------------------

api: build: context: . dockerfile: Dockerfile

container_name: sre-agent-api

restart: unless-stopped

env_file:
  - .env

environment:
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0

ports:
  - "8000:8000"

depends_on:
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

networks:
  - sre-agent-network

security_opt:
  - no-new-privileges:true

read_only: true

tmpfs:
  - /tmp:size=64M,mode=1777

-----------------------------------------------
PostgreSQL Database
-----------------------------------------------

db: image: postgres:17-alpine

container_name: sre-agent-db

restart: unless-stopped

environment:
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

ports:
  - "127.0.0.1:5432:5432"

volumes:
  - postgres_data:/var/lib/postgresql/data

healthcheck:
  test:
    - CMD-SHELL
    - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

networks:
  - sre-agent-network

-----------------------------------------------
Redis Cache and Message Broker
-----------------------------------------------

redis: image: redis:7-alpine

container_name: sre-agent-redis

restart: unless-stopped

command:
  - redis-server
  - --appendonly
  - "yes"
  - --maxmemory
  - 256mb
  - --maxmemory-policy
  - noeviction

volumes:
  - redis_data:/data

healthcheck:
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5

networks:
  - sre-agent-network

-----------------------------------------------
Persistent Volumes
-----------------------------------------------

volumes: postgres_data: name: sre-agent-postgres-data

redis_data: name: sre-agent-redis-data

-----------------------------------------------
Internal Network
-----------------------------------------------

networks: sre-agent-network: name: sre-agent-network driver: bridge
