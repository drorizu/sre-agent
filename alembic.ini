
# ==================================================
# SRE AGENT - ALEMBIC CONFIGURATION
# ==================================================

[alembic]

# Migration scripts directory
script_location = alembic

# Python import path
prepend_sys_path = .

# Migration filename format
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone for migration filenames
timezone = UTC

# Maximum slug length
truncate_slug_length = 60

# Encoding for migration files
output_encoding = utf-8


# ==================================================
# Database Connection
# ==================================================

# Database URL is configured dynamically in alembic/env.py
# using the application configuration.
sqlalchemy.url =


# ==================================================
# Logging Configuration
# ==================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
stream = ext://sys.stderr


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
